name: Aura CI/CD & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Backend API Contract & Client Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            client/package-lock.json

      - name: Install Backend & Verify Contracts
        run: |
          cd backend
          npm install
          node server.js &
          sleep 4
          node test.js

      - name: Install Client & Validate Production Build
        run: |
          cd client
          npm install
          npm run build

  eas-build:
    name: Expo Application Services (EAS) Build Check
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && env.HAS_EXPO_TOKEN == 'true'
    env:
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check Mobile Setup
        run: |
          cd mobile
          node scripts/validate-config.js
