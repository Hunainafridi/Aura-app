name: Aura CI/CD & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Full Stack Verification & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend & Verify Contracts
        run: |
          cd backend
          npm install
          node server.js &
          sleep 4
          node test.js

      - name: Install Client & Validate Production Build
        run: |
          cd client
          npm install
          npm run build

      - name: Verify Mobile Store Configuration & Integrity
        run: |
          cd mobile
          node scripts/validate-config.js
